name: RAG Service CI

on:
  push:
    paths: ["rag-service/**", ".github/workflows/rag-ci.yml"]
  pull_request:
    paths: ["rag-service/**", ".github/workflows/rag-ci.yml"]

jobs:
  quality:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rag-service
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11", cache: pip, cache-dependency-path: rag-service/requirements-dev.txt}
      - run: pip install -r requirements-dev.txt
      - run: alembic upgrade head
        env:
          DATABASE_URL: sqlite:///data/ci-rag.db
      - run: pytest -q
      - run: ruff check app tests scripts integration
      - run: mypy
      - run: pip check
      - run: pip-audit -r requirements.txt
      - run: python scripts/export_openapi.py
        env:
          GEMINI_MODEL: contract-model
          SPRING_BOOT_INTERNAL_API_KEY: contract-secret
      - run: git diff --exit-code -- docs/openapi.json
      - run: docker build -t bkquiz-rag:test .
      - run: docker compose -f docker-compose.yml -f docker-compose.test.yml up --build --abort-on-container-exit --exit-code-from integration-test integration-test
