APP_ENV: production
APP_BUILD_REVISION: replace-with-git-sha
GEMINI_MODEL: gemini-3.5-flash-lite
GEMINI_OAUTH_ENABLED: "false"
LLM_FALLBACK_ENABLED: "true"
OLLAMA_ENABLED: "false"
DATABASE_POOL_SIZE: "4"
DATABASE_MAX_OVERFLOW: "1"
INDEX_LOCK_MODE: redis
CACHE_REDIS_PROVIDER: upstash
CACHE_REDIS_MAX_CONNECTIONS: "10"
JOB_DISPATCH_BACKEND: gcp
GCP_PROJECT_ID: replace-with-project-id
GCP_REGION: asia-southeast1
PUBSUB_INDEXING_TOPIC: bkquiz-rag-indexing
CLOUD_TASKS_QUEUE: bkquiz-rag-indexing
CLOUD_TASKS_WORKER_URL: https://replace-with-rag-service-url
CLOUD_TASKS_OIDC_AUDIENCE: https://replace-with-rag-service-url
CLOUD_TASKS_SERVICE_ACCOUNT_EMAIL: replace-with-rag-events-service-account
CLOUD_TASKS_DISPATCH_DEADLINE_SECONDS: "900"
VECTOR_STORE_BACKEND: qdrant
QDRANT_URL: https://replace-with-cluster.region.cloud.qdrant.io:6333
QDRANT_COLLECTION: bkquiz_chunks
DOCUMENT_STORAGE_BACKEND: r2
DOCUMENT_STORAGE_ENDPOINT: https://replace-with-account-id.r2.cloudflarestorage.com
DOCUMENT_STORAGE_BUCKET: replace-with-r2-bucket
DOCUMENT_STORAGE_REGION: auto
DOCUMENT_STORAGE_PREFIX: rag-documents
DOCUMENT_STAGING_DIR: /tmp/bkquiz-rag
EMBEDDING_BACKEND: onnx
EMBEDDING_PRECISION: int8
EMBEDDING_ONNX_MODEL_PATH: /app/models/embedding-onnx
RAG_PRELOAD_EMBEDDING: "true"
RAG_LOW_MEMORY_MODE: "true"
RAG_CPU_THREADS: "2"
WORKER_MODEL_IDLE_SECONDS: "60"
