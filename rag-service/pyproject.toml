[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "integration: tests requiring Redis/Celery or containers",
  "evaluation: retrieval regression evaluation",
]

[tool.ruff]
target-version = "py311"
line-length = 120
exclude = [".venv", "data", "migrations/versions"]

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"scripts/*.py" = ["E402"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
check_untyped_defs = true
warn_unused_ignores = true
exclude = ["migrations", "tests"]
follow_imports = "skip"
files = [
  "app/core/config.py",
  "app/core/exceptions.py",
  "app/core/request_context.py",
  "app/services/indexing_job_service.py",
  "app/services/document_object_storage.py",
  "app/services/qdrant_vector_store.py",
  "app/services/user_index_manager.py",
  "app/services/user_document_service.py",
  "app/services/vector_store_factory.py",
  "app/services/async_document_service.py",
  "app/services/cache_redis.py",
  "app/services/gcp_job_transport.py",
  "app/services/rate_limiter.py",
  "app/api/routes/v2.py",
  "app/api/routes/cloud_jobs.py",
  "app/worker",
]
