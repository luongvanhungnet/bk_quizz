spring:
  config:
    import: optional:file:../.env[.properties],optional:file:.env[.properties]
  application:
    name: bkquiz-api
  datasource:
    # DATABASE_* is the canonical contract used by Docker Compose and .env.
    # BKQUIZ_DATABASE_* remains supported for existing local environments.
    url: ${DATABASE_URL:${BKQUIZ_DATABASE_URL:jdbc:postgresql://localhost:5432/bkquiz}}
    username: ${DATABASE_USERNAME:${BKQUIZ_DATABASE_USERNAME:bkquiz}}
    password: ${DATABASE_PASSWORD:${BKQUIZ_DATABASE_PASSWORD:bkquiz}}
    hikari:
      maximum-pool-size: ${DATABASE_POOL_SIZE:6}
      minimum-idle: ${DATABASE_MIN_IDLE:1}
      connection-timeout: 10000
      idle-timeout: 60000
      data-source-properties:
        reWriteBatchedInserts: true
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
          batch_size: ${DATABASE_JDBC_BATCH_SIZE:50}
        order_inserts: true
        order_updates: true
        session:
          events:
            log:
              LOG_QUERIES_SLOWER_THAN_MS: ${DATABASE_SLOW_QUERY_MS:300}
        format_sql: false
  flyway:
    enabled: ${FLYWAY_ENABLED:true}
    locations: classpath:db/migration
    validate-migration-naming: true
    user: ${DATABASE_MIGRATION_USERNAME:${DATABASE_USERNAME:${BKQUIZ_DATABASE_USERNAME:bkquiz}}}
    password: ${DATABASE_MIGRATION_PASSWORD:${DATABASE_PASSWORD:${BKQUIZ_DATABASE_PASSWORD:bkquiz}}}
  lifecycle:
    timeout-per-shutdown-phase: ${SHUTDOWN_TIMEOUT:30s}
  servlet:
    multipart:
      max-file-size: ${MAX_UPLOAD_SIZE:50MB}
      max-request-size: ${MAX_REQUEST_SIZE:55MB}
  jackson:
    default-property-inclusion: non_null
    time-zone: UTC
  data:
    redis:
      url: ${REDIS_URL:redis://localhost:6379}
      connect-timeout: ${REDIS_CONNECT_TIMEOUT:2s}
      timeout: ${REDIS_COMMAND_TIMEOUT:2s}
      repositories:
        enabled: false
  ai:
    model:
      chat: ${AI_CHAT_PROVIDER:none}
    google:
      genai:
        api-key: ${GEMINI_API_KEY:}
        chat:
          model: ${GEMINI_MODEL:gemini-3.5-flash}
          response-mime-type: application/json

server:
  port: ${PORT:8080}
  shutdown: graceful
  forward-headers-strategy: framework
  servlet:
    encoding:
      charset: UTF-8
      enabled: true
      force: true
  max-http-request-header-size: 16KB

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: when_authorized

springdoc:
  api-docs:
    enabled: ${API_DOCS_ENABLED:true}
    path: /api/openapi.json
  swagger-ui:
    path: /api/docs

bkquiz:
  frontend-origins: ${FRONTEND_ORIGINS:http://localhost:5173}
  security:
    access-secret: ${JWT_ACCESS_SECRET:change-me-in-production-access-secret-32chars}
    access-ttl: ${JWT_ACCESS_TTL:15m}
    refresh-ttl: ${REFRESH_TOKEN_TTL:7d}
    refresh-cookie-name: bkquiz_refresh
    xsrf-cookie-name: XSRF-TOKEN
    cookie-secure: ${COOKIE_SECURE:false}
    bcrypt-strength: ${BCRYPT_STRENGTH:12}
  storage:
    provider: ${STORAGE_PROVIDER:local}
    local-root: ${LOCAL_STORAGE_ROOT:./data/uploads}
    local-temp: ${LOCAL_STORAGE_TEMP:./data/tmp}
    user-quota-bytes: ${USER_STORAGE_QUOTA_BYTES:2147483648}
    endpoint: ${S3_ENDPOINT:http://localhost:9000}
    region: ${S3_REGION:us-east-1}
    access-key: ${S3_ACCESS_KEY:minioadmin}
    secret-key: ${S3_SECRET_KEY:minioadmin}
    bucket: ${S3_BUCKET:bkquiz}
    path-style: ${S3_PATH_STYLE:true}
    clamav-host: ${CLAMAV_HOST:localhost}
    clamav-port: ${CLAMAV_PORT:3310}
    clamav-enabled: ${CLAMAV_ENABLED:false}
  ai:
    enabled: ${AI_ENABLED:false}
    generation-model: ${GEMINI_MODEL:gemini-3.5-flash}
    embedding-model: ${GEMINI_EMBEDDING_MODEL:gemini-embedding-2}
    embedding-dimensions: ${GEMINI_EMBEDDING_DIMENSIONS:768}
    timeout: ${GEMINI_TIMEOUT:60s}
    max-attempts: ${GEMINI_MAX_ATTEMPTS:3}
    max-questions: ${MAX_QUESTIONS_PER_QUIZ:100}
    max-sources: ${MAX_SOURCES_PER_GENERATION:10}
    min-source-characters: ${MIN_SOURCE_CHARACTERS:100}
  quiz-generation:
    batch-max-questions: ${QUIZ_BATCH_MAX_QUESTIONS:20}
    batch-max-attempts: ${QUIZ_BATCH_MAX_ATTEMPTS:3}
    batch-retry-delay: ${QUIZ_BATCH_RETRY_DELAY:5m}
    batch-success-delay: ${QUIZ_BATCH_SUCCESS_DELAY:15s}
  jobs:
    worker-enabled: ${WORKER_ENABLED:true}
    poll-delay: ${JOB_POLL_DELAY:2s}
    heartbeat-delay: ${JOB_WORKER_HEARTBEAT_DELAY:10s}
    lease-duration: ${JOB_LEASE_DURATION:2m}
    max-attempts: ${JOB_MAX_ATTEMPTS:5}
  realtime:
    provider: ${REALTIME_PROVIDER:stomp}
    ably-api-key: ${ABLY_API_KEY:}
    channel-prefix: ${ABLY_CHANNEL_PREFIX:bkquiz:classroom:}
    token-ttl-seconds: ${ABLY_TOKEN_TTL_SECONDS:300}
    publish-enabled: ${REALTIME_PUBLISH_ENABLED:true}
  rag:
    enabled: ${RAG_ENABLED:false}
    base-url: ${RAG_SERVICE_URL:http://127.0.0.1:8090}
    internal-api-key: ${RAG_INTERNAL_API_KEY:}
    connect-timeout: ${RAG_CONNECT_TIMEOUT:5s}
    read-timeout: ${RAG_READ_TIMEOUT:120s}
    health-poll-delay: ${RAG_HEALTH_POLL_DELAY:10s}
    iam:
      enabled: ${RAG_IAM_ENABLED:false}
      audience: ${RAG_IAM_AUDIENCE:}
  admin-bootstrap:
    enabled: ${ADMIN_BOOTSTRAP_ENABLED:false}
    user-id: ${ADMIN_BOOTSTRAP_USER_ID:}
  anti-abuse:
    enabled: ${ANTI_ABUSE_ENABLED:false}
    ip-hash-secret: ${ANTI_ABUSE_IP_HASH_SECRET:${JWT_ACCESS_SECRET:change-me-in-production-access-secret-32chars}}
    rate-window: ${ANTI_ABUSE_RATE_WINDOW:1h}
    user-rate-limit: ${ANTI_ABUSE_USER_RATE_LIMIT:20}
    ip-rate-limit: ${ANTI_ABUSE_IP_RATE_LIMIT:40}
    device-rate-limit: ${ANTI_ABUSE_DEVICE_RATE_LIMIT:30}
    concurrency-ttl: ${AI_CONCURRENCY_TTL:30m}
    cost-key-ttl: ${AI_COST_KEY_TTL:3d}
    pricing:
      default-input-per-million: ${AI_DEFAULT_INPUT_COST_PER_MILLION:0.10}
      default-output-per-million: ${AI_DEFAULT_OUTPUT_COST_PER_MILLION:0.40}
      estimated-input-tokens-per-question: ${AI_ESTIMATED_INPUT_TOKENS_PER_QUESTION:900}
      estimated-output-tokens-per-question: ${AI_ESTIMATED_OUTPUT_TOKENS_PER_QUESTION:500}
    levels:
      trusted:
        daily-quota: ${AI_TRUSTED_DAILY_QUOTA:100}
        daily-cost-budget: ${AI_TRUSTED_DAILY_COST_BUDGET:2.00}
        concurrency: ${AI_TRUSTED_CONCURRENCY:3}
        challenge-required: false
      normal:
        daily-quota: ${AI_NORMAL_DAILY_QUOTA:40}
        daily-cost-budget: ${AI_NORMAL_DAILY_COST_BUDGET:0.80}
        concurrency: ${AI_NORMAL_CONCURRENCY:2}
        challenge-required: false
      caution:
        daily-quota: ${AI_CAUTION_DAILY_QUOTA:15}
        daily-cost-budget: ${AI_CAUTION_DAILY_COST_BUDGET:0.30}
        concurrency: ${AI_CAUTION_CONCURRENCY:1}
        challenge-required: false
      restricted:
        daily-quota: ${AI_RESTRICTED_DAILY_QUOTA:3}
        daily-cost-budget: ${AI_RESTRICTED_DAILY_COST_BUDGET:0.08}
        concurrency: ${AI_RESTRICTED_CONCURRENCY:1}
        challenge-required: true
      blocked:
        daily-quota: 0
        daily-cost-budget: 0
        concurrency: 0
        challenge-required: true
    risk:
      verified-email-trust: ${RISK_VERIFIED_EMAIL_TRUST:15}
      normal-activity-trust: ${RISK_NORMAL_ACTIVITY_TRUST:3}
      successful-session-trust: ${RISK_SUCCESSFUL_SESSION_TRUST:1}
      account-age-trust-per-day: ${RISK_ACCOUNT_AGE_TRUST_PER_DAY:0.10}
      account-age-trust-cap: ${RISK_ACCOUNT_AGE_TRUST_CAP:10}
      trusted-min-score: ${RISK_TRUSTED_MIN_SCORE:75}
      trusted-min-legitimate-activities: ${RISK_TRUSTED_MIN_LEGITIMATE_ACTIVITIES:10}
      caution-risk-score: ${RISK_CAUTION_SCORE:0.30}
      restricted-risk-score: ${RISK_RESTRICTED_SCORE:0.60}
      blocked-risk-score: ${RISK_BLOCKED_SCORE:0.90}
    turnstile:
      enabled: ${TURNSTILE_ENABLED:false}
      secret-key: ${TURNSTILE_SECRET_KEY:}
      verify-url: ${TURNSTILE_VERIFY_URL:https://challenges.cloudflare.com/turnstile/v0/siteverify}
  analytics:
    aggregation-enabled: ${ANALYTICS_AGGREGATION_ENABLED:true}
    aggregation-delay: ${ANALYTICS_AGGREGATION_DELAY:5m}
    max-range-days: ${ANALYTICS_MAX_RANGE_DAYS:366}

logging:
  pattern:
    level: "%5p [traceId:%X{traceId:-}]"
  level:
    org.hibernate.SQL: WARN
    org.springframework.security: INFO

resend:
  api:
    # RESEND_API_TOKEN is canonical. RESEND_API_KEY remains a rollout fallback.
    key: ${RESEND_API_TOKEN:${RESEND_API_KEY:}}
    url: ${RESEND_API_URL:https://api.resend.com/emails}
    connect-timeout: ${RESEND_CONNECT_TIMEOUT:30s}
    read-timeout: ${RESEND_READ_TIMEOUT:45s}
    network-retry-delay: ${RESEND_NETWORK_RETRY_DELAY:30s}

app:
  mail:
    from: ${APP_MAIL_FROM:}
