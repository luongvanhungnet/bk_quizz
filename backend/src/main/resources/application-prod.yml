spring:
  datasource:
    # Cloud Run must receive a Neon JDBC URL. Put sslmode=require in DATABASE_URL.
    url: ${DATABASE_URL}
    username: ${DATABASE_USERNAME}
    password: ${DATABASE_PASSWORD}
    hikari:
      maximum-pool-size: ${DATABASE_POOL_SIZE:4}
      minimum-idle: ${DATABASE_MIN_IDLE:0}
  flyway:
    # Migrations are executed once as a release step, never by every Cloud Run replica.
    enabled: ${FLYWAY_ENABLED:false}

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

bkquiz:
  # Required in production. Do not inherit the localhost development default.
  frontend-origins: ${FRONTEND_ORIGINS}
  jobs:
    worker-enabled: ${WORKER_ENABLED:false}
  security:
    cookie-secure: ${COOKIE_SECURE:true}
  storage:
    # Cloud Run filesystem is ephemeral. Production objects are stored in private Cloudflare R2.
    provider: ${STORAGE_PROVIDER:s3}
    local-root: ${LOCAL_STORAGE_ROOT:/tmp/bkquiz/uploads}
    local-temp: ${LOCAL_STORAGE_TEMP:/tmp/bkquiz/tmp}
    endpoint: ${S3_ENDPOINT}
    region: ${S3_REGION:auto}
    access-key: ${S3_ACCESS_KEY}
    secret-key: ${S3_SECRET_KEY}
    bucket: ${S3_BUCKET}
    path-style: ${S3_PATH_STYLE:true}

management:
  endpoint:
    health:
      group:
        liveness:
          include: livenessState
        readiness:
          include: readinessState,db

logging:
  level:
    root: INFO
    org.springframework.security: WARN
