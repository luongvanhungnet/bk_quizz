name: bkquiz

services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-bkquiz}
      POSTGRES_USER: ${POSTGRES_USER:-bkquiz}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-bkquiz}
    ports: ["5432:5432"]
    volumes: ["postgres-data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-bkquiz} -d ${POSTGRES_DB:-bkquiz}"]
      interval: 5s
      timeout: 5s
      retries: 20

  minio:
    profiles: ["s3"]
    image: minio/minio:RELEASE.2025-07-23T15-54-02Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    ports: ["9000:9000", "9001:9001"]
    volumes: ["minio-data:/data"]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 20

  minio-init:
    profiles: ["s3"]
    image: minio/mc:RELEASE.2025-07-21T05-28-08Z
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >-
      /bin/sh -c "mc alias set local http://minio:9000
      ${MINIO_ROOT_USER:-minioadmin} ${MINIO_ROOT_PASSWORD:-minioadmin} &&
      mc mb --ignore-existing local/bkquiz && mc anonymous set none local/bkquiz"

  clamav:
    image: clamav/clamav:1.4
    volumes: ["clamav-data:/var/lib/clamav"]
    healthcheck:
      test: ["CMD", "/usr/local/bin/clamdcheck.sh"]
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 90s

  api:
    build: { context: ./backend }
    environment: &backend-env
      DATABASE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-bkquiz}
      DATABASE_USERNAME: ${POSTGRES_USER:-bkquiz}
      DATABASE_PASSWORD: ${POSTGRES_PASSWORD:-bkquiz}
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:-local-development-secret-change-now-32}
      FRONTEND_ORIGINS: ${FRONTEND_ORIGINS:-http://localhost:5173,http://localhost:3000}
      S3_ENDPOINT: http://minio:9000
      S3_ACCESS_KEY: ${MINIO_ROOT_USER:-minioadmin}
      S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin}
      S3_BUCKET: bkquiz
      STORAGE_PROVIDER: ${STORAGE_PROVIDER:-local}
      LOCAL_STORAGE_ROOT: /app/data/uploads
      LOCAL_STORAGE_TEMP: /app/data/tmp
      USER_STORAGE_QUOTA_BYTES: ${USER_STORAGE_QUOTA_BYTES:-2147483648}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      RESEND_API_URL: ${RESEND_API_URL:-https://api.resend.com/emails}
      RESEND_CONNECT_TIMEOUT: ${RESEND_CONNECT_TIMEOUT:-10s}
      RESEND_READ_TIMEOUT: ${RESEND_READ_TIMEOUT:-15s}
      APP_MAIL_FROM: ${APP_MAIL_FROM:-}
      AI_ENABLED: ${AI_ENABLED:-false}
      AI_CHAT_PROVIDER: ${AI_CHAT_PROVIDER:-none}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      WORKER_ENABLED: "false"
      RAG_SERVICE_URL: ${RAG_SERVICE_URL:-http://rag-api:8000}
      RAG_INTERNAL_API_KEY: ${SPRING_BOOT_INTERNAL_API_KEY:-change-me-with-a-long-random-secret}
      RAG_ENABLED: ${RAG_ENABLED:-true}
      RAG_CONNECT_TIMEOUT: ${RAG_CONNECT_TIMEOUT:-5s}
      RAG_READ_TIMEOUT: ${RAG_READ_TIMEOUT:-120s}
    depends_on:
      postgres: { condition: service_healthy }
    ports: ["8080:8080"]
    volumes: ["bkquiz-uploads:/app/data"]
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/actuator/health/readiness | grep UP"]
      interval: 10s
      timeout: 5s
      retries: 20

  worker:
    build: { context: ./backend }
    environment:
      <<: *backend-env
      WORKER_ENABLED: "true"
      PORT: 8081
    depends_on:
      api: { condition: service_healthy }
      clamav: { condition: service_healthy }
    volumes: ["bkquiz-uploads:/app/data"]

  rag-redis:
    profiles: ["rag"]
    image: redis:7.4-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes: ["rag-redis-data:/data"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  rag-qdrant:
    profiles: ["rag"]
    image: qdrant/qdrant:v1.19.0
    ports: ["127.0.0.1:6333:6333"]
    volumes: ["rag-qdrant-data:/qdrant/storage"]

  rag-api:
    profiles: ["rag"]
    build: {context: ./rag-service}
    command: ["sh", "-c", "alembic upgrade head && exec uvicorn app.main:app --host 0.0.0.0 --port 8000 --workers 1"]
    environment: &rag-env
      APP_ENV: development
      APP_BUILD_REVISION: ${RAG_BUILD_REVISION:-development}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-}
      GEMINI_MAX_RETRIES: ${GEMINI_MAX_RETRIES:-3}
      SPRING_BOOT_INTERNAL_API_KEY: ${SPRING_BOOT_INTERNAL_API_KEY:-change-me-with-a-long-random-secret}
      SPRING_BOOT_PREVIOUS_INTERNAL_API_KEY: ${SPRING_BOOT_PREVIOUS_INTERNAL_API_KEY:-}
      REDIS_URL: redis://rag-redis:6379/0
      REDIS_CONNECT_TIMEOUT_SECONDS: 1
      REDIS_SOCKET_TIMEOUT_SECONDS: 2
      INDEX_LOCK_MODE: redis
      INDEX_LOCK_FALLBACK_COOLDOWN_SECONDS: 30
      DATABASE_URL: sqlite:////app/data/rag.db
      PORT: 8000
      VECTOR_STORE_BACKEND: qdrant
      QDRANT_URL: http://rag-qdrant:6333
      QDRANT_API_KEY: ""
      QDRANT_COLLECTION: bkquiz_chunks
      USER_UPLOAD_DIR: /app/data/uploads/users
      USER_INDEX_DIR: /app/data/indexes/users
      SYSTEM_DOCUMENTS_DIR: /app/data/system-documents
      SYSTEM_INDEX_DIR: /app/data/indexes/system
      EMBEDDING_BACKEND: onnx
      EMBEDDING_PRECISION: int8
      EMBEDDING_ONNX_MODEL_PATH: /app/models/embedding-onnx
      RAG_PRELOAD_EMBEDDING: "true"
      RAG_CPU_THREADS: 2
      RERANK_MIN_CANDIDATES: 3
      RERANKER_ENABLED: "false"
      CITATION_MATCH_MODE: ${CITATION_MATCH_MODE:-semantic}
      CITATION_LEXICAL_MIN_SCORE: ${CITATION_LEXICAL_MIN_SCORE:-0.82}
      CITATION_SEMANTIC_SAME_SOURCE_MIN_SCORE: ${CITATION_SEMANTIC_SAME_SOURCE_MIN_SCORE:-0.72}
      CITATION_SEMANTIC_CROSS_SOURCE_MIN_SCORE: ${CITATION_SEMANTIC_CROSS_SOURCE_MIN_SCORE:-0.80}
      CITATION_UNIQUENESS_MARGIN: ${CITATION_UNIQUENESS_MARGIN:-0.08}
      CITATION_MAX_WINDOW_CHARS: ${CITATION_MAX_WINDOW_CHARS:-600}
      CITATION_MAX_CANDIDATES_PER_SOURCE: ${CITATION_MAX_CANDIDATES_PER_SOURCE:-128}
    depends_on:
      rag-qdrant: {condition: service_started}
      rag-redis: {condition: service_healthy}
    ports: ["8000:8000"]
    volumes: ["rag-data:/app/data"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/live')"]
      interval: 10s
      timeout: 5s
      retries: 30

  rag-worker:
    profiles: ["rag"]
    build: {context: ./rag-service}
    command: ["celery", "-A", "app.worker.celery_app:celery_app", "worker", "--loglevel=INFO", "--pool=solo", "--concurrency=1"]
    environment:
      <<: *rag-env
      WORKER_METRICS_PORT: 9101
    depends_on:
      rag-api: {condition: service_healthy}
    volumes: ["rag-data:/app/data"]
    ports: ["9101:9101"]

  rag-beat:
    profiles: ["rag"]
    build: {context: ./rag-service}
    command: ["celery", "-A", "app.worker.celery_app:celery_app", "beat", "--loglevel=INFO"]
    environment: *rag-env
    depends_on:
      rag-api: {condition: service_healthy}
    volumes: ["rag-data:/app/data"]

volumes:
  postgres-data:
  minio-data:
  clamav-data:
  bkquiz-uploads:
  rag-data:
  rag-redis-data:
  rag-qdrant-data:
