name: bkquiz

services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-bkquiz}
      POSTGRES_USER: ${POSTGRES_USER:-bkquiz}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-bkquiz}
    ports: ["5432:5432"]
    volumes: ["postgres-data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-bkquiz} -d ${POSTGRES_DB:-bkquiz}"]
      interval: 5s
      timeout: 5s
      retries: 20

  minio:
    profiles: ["s3"]
    image: minio/minio:RELEASE.2025-07-23T15-54-02Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    ports: ["9000:9000", "9001:9001"]
    volumes: ["minio-data:/data"]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 20

  minio-init:
    profiles: ["s3"]
    image: minio/mc:RELEASE.2025-07-21T05-28-08Z
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >-
      /bin/sh -c "mc alias set local http://minio:9000
      ${MINIO_ROOT_USER:-minioadmin} ${MINIO_ROOT_PASSWORD:-minioadmin} &&
      mc mb --ignore-existing local/bkquiz && mc anonymous set none local/bkquiz"

  clamav:
    image: clamav/clamav:1.4
    volumes: ["clamav-data:/var/lib/clamav"]
    healthcheck:
      test: ["CMD", "/usr/local/bin/clamdcheck.sh"]
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 90s

  api:
    build: { context: ./backend }
    environment: &backend-env
      DATABASE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-bkquiz}
      DATABASE_USERNAME: ${POSTGRES_USER:-bkquiz}
      DATABASE_PASSWORD: ${POSTGRES_PASSWORD:-bkquiz}
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:-local-development-secret-change-now-32}
      FRONTEND_ORIGINS: ${FRONTEND_ORIGINS:-http://localhost:5173,http://localhost:3000}
      S3_ENDPOINT: http://minio:9000
      S3_ACCESS_KEY: ${MINIO_ROOT_USER:-minioadmin}
      S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin}
      S3_BUCKET: bkquiz
      STORAGE_PROVIDER: ${STORAGE_PROVIDER:-local}
      LOCAL_STORAGE_ROOT: /app/data/uploads
      LOCAL_STORAGE_TEMP: /app/data/tmp
      USER_STORAGE_QUOTA_BYTES: ${USER_STORAGE_QUOTA_BYTES:-2147483648}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      RESEND_API_URL: ${RESEND_API_URL:-https://api.resend.com/emails}
      RESEND_CONNECT_TIMEOUT: ${RESEND_CONNECT_TIMEOUT:-10s}
      RESEND_READ_TIMEOUT: ${RESEND_READ_TIMEOUT:-15s}
      APP_MAIL_FROM: ${APP_MAIL_FROM:-}
      AI_ENABLED: ${AI_ENABLED:-false}
      AI_CHAT_PROVIDER: ${AI_CHAT_PROVIDER:-none}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      WORKER_ENABLED: "false"
    depends_on:
      postgres: { condition: service_healthy }
    ports: ["8080:8080"]
    volumes: ["bkquiz-uploads:/app/data"]
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/actuator/health/readiness | grep UP"]
      interval: 10s
      timeout: 5s
      retries: 20

  worker:
    build: { context: ./backend }
    environment:
      <<: *backend-env
      WORKER_ENABLED: "true"
      PORT: 8081
    depends_on:
      api: { condition: service_healthy }
      clamav: { condition: service_healthy }
    volumes: ["bkquiz-uploads:/app/data"]

volumes:
  postgres-data:
  minio-data:
  clamav-data:
  bkquiz-uploads:
